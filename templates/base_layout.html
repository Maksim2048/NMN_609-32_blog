{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Default title{% endblock title %}</title>
    <link rel="stylesheet" href="{% static "css/style.css" %}">
</head>
<body>
    <header>
        <div class="logo">
            <img src="{% static "img/logo.png" %}" alt="">
        </div>
        <nav class="container">
            <ul>
                <li><a href="{% url 'homepage' %}">Homepage</a></li>
                <li><a href="{% url 'about' %}">About</a></li>
                <li><a href="{% url 'homepage' %}">Articles</a></li>
                <li><a href="{% url 'accounts:signup' %}">Signup</a></li>
                {% if user.is_authenticated %}
                <li>
                    <form class="form" action="{% url 'accounts:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit">Logout</button>
                    </form>
                </li>
                {% else %}
                    <li>
                        <a class="btn btn-outline-primary" href="{% url 'accounts:login' %}">Login</a>
                    </li>
                    <li>
                        <a class="btn btn-primary" href="{% url 'accounts:signup' %}">Sign up</a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock content %}
    </div>
</body>
</html>
